[package]
name = "event-clustering"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
eframe = { version = "0.34", features = ["glow"] }
thiserror = "2.0"
neuromorphic-drivers = { version = "0.18.1", optional = true }

[features]
# Live input from an event camera over USB; see the README.
camera = ["dep:neuromorphic-drivers"]
